<div class="grid">
  @for (celular of celulares; track celular.nombre) {
    <div class="tarjeta" [routerLink]="['/celular', celular.nombre]" >
      <img [src]="celular.imagen" [alt]="celular.nombre"/>
      <h3>{{celular.nombre}}</h3>
      <p>{{celular.marca}} · {{celular.almacenamiento}}</p>
      <p>{{celular.pantalla}}</p>
    </div>
  }
</div>
