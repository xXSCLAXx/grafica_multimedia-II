<div class="lienzo">

 [style.top.px]="posicionY"
 [style.width.px]="tamano"
 [style.height.px]="tamano"
 [style.background]="color"
 [style.visibility]="visible ? 'visible' : 'hidden'">

  [visible]="visible"
  (accion)="ejecutarAccion($event)"
